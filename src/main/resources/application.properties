# Server Port
server.port=9090

# Spring Application Name
spring.application.name=erp-api

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/benjeddou_erp?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&maxAllowedPacket=20971520
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
# validate = vérifie le schema sans modifier (sécurité multi-tenant)
spring.jpa.hibernate.ddl-auto=update
# PERFORMANCE : désactivé en dev pour éviter le flood de logs SQL
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# PERFORMANCE : désactiver open-in-view évite les requêtes lazy imprévues
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# ── Multi-Tenant : Base entreprise par défaut (démo/dev) ───────────────
tenant.default.schema=erp_ent_00000
tenant.default.url=jdbc:mysql://localhost:3306/erp_ent_00000?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
tenant.default.username=root
tenant.default.password=

# JWT Settings — J3 Sécurité
# Secret key must be at least 256 bits (32 bytes) long
benjeddou.erp.jwtSecret=BenjeddouErpSuperSecretSigningKeyForJwtAuthenticationSecuredWith256BitsLength
# Access token : 15 minutes
benjeddou.erp.jwtExpirationMs=900000
# Refresh token : 7 jours
benjeddou.erp.refreshTokenDurationMs=604800000

# File Upload configuration — stockage BLOB en base de données
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# MySQL — permettre les gros BLOB (20 Mo)
spring.datasource.hikari.connection-init-sql=SET GLOBAL max_allowed_packet=20971520
# PERFORMANCE : HikariCP pool de connexions optimisé
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=BenjeddouHikariPool

# Désactiver le lazy-loading pour éviter les erreurs BLOB avec Hibernate
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
