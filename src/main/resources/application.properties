# Server Port
server.port=9090

# Spring Application Name
spring.application.name=erp-api

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/benjeddou_erp?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&maxAllowedPacket=20971520
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Force le chargement immédiat des BLOB (pas de lazy loading)
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.open-in-view=true

# JWT Settings
# Secret key must be at least 256 bits (32 bytes) long (base64 encoded below)
benjeddou.erp.jwtSecret=BenjeddouErpSuperSecretSigningKeyForJwtAuthenticationSecuredWith256BitsLength
benjeddou.erp.jwtExpirationMs=86400000

# File Upload configuration — stockage BLOB en base de données
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# MySQL — permettre les gros BLOB (20 Mo)
spring.datasource.hikari.connection-init-sql=SET GLOBAL max_allowed_packet=20971520

# Désactiver le lazy-loading pour éviter les erreurs BLOB avec Hibernate
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

